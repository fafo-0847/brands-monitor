name: Monitor Pakistan fashion brands (incl. Khushposh, Outfitters)
on:
  schedule:
    # Twice a day, 12 hours apart (06:07 and 18:07 Pakistan time). A full run takes about 6 hours.
    - cron: '7 1,13 * * *'
  workflow_dispatch:
    inputs:
      brands:
        description: 'Optional space-separated brand slugs (blank = all)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: brands-monitor
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      brands: ${{ steps.matrix.outputs.brands }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build brand matrix
        id: matrix
        shell: bash
        env:
          SELECTED: ${{ github.event.inputs.brands }}
        run: |
          set -euo pipefail
          if [ -n "${SELECTED:-}" ]; then
            brands=$(python -c 'import json,os; print(json.dumps(os.environ["SELECTED"].split()))')
          else
            brands=$(python -m brands.run --matrix)
          fi
          echo "brands=$brands" >> "$GITHUB_OUTPUT"
          echo "Brands: $brands"

  monitor:
    name: Check ${{ matrix.brand }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        brand: ${{ fromJSON(needs.plan.outputs.brands) }}
    env:
      BRAND: ${{ matrix.brand }}
      STATE_DIR: brands/${{ matrix.brand }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore persistent baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          state_ref="origin/monitor-state:$STATE_DIR/state.json"
          if git cat-file -e "$state_ref" 2>/dev/null; then
            git show "$state_ref" > data/state.json
          elif git cat-file -e "origin/monitor-state:$STATE_DIR/changes.json" 2>/dev/null; then
            echo "A change report exists for $BRAND, but its baseline is missing."
            exit 1
          else
            # Khushposh/Outfitters were saved by the old monitor.yml (branch root / outfitters/).
            legacy=$(python -m brands.run --legacy-state "$BRAND")
            if [ -n "$legacy" ] && git cat-file -e "origin/monitor-state:$legacy" 2>/dev/null; then
              echo "Migrating baseline from monitor-state:$legacy to $STATE_DIR/state.json"
              git show "origin/monitor-state:$legacy" > data/state.json
            fi
          fi
      - name: Check catalog and email changes
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MONITOR_PROXY: ${{ secrets.MONITOR_PROXY }}
          # Digest emails are off (owner's choice, 2026-11-17); the app shows changes instead.
          # Set to 'on' to send them again.
          MONITOR_EMAIL: 'off'
        run: python -m brands.run --brand "$BRAND" --state data/state.json --report data/changes.json
      - name: Persist successful check on monitor-state branch
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          store="$RUNNER_TEMP/brand-state"
          # Rebuild on the latest monitor-state tip and retry if a push races.
          for attempt in 1 2 3 4 5; do
            git worktree remove --force "$store" 2>/dev/null || true
            git fetch origin monitor-state 2>/dev/null || true
            if git show-ref --verify --quiet refs/remotes/origin/monitor-state; then
              git worktree add -B monitor-state "$store" origin/monitor-state
            else
              git worktree add --detach "$store" HEAD
              git -C "$store" checkout --orphan monitor-state
              git -C "$store" rm -rf .
            fi
            mkdir -p "$store/$STATE_DIR"
            cp data/state.json "$store/$STATE_DIR/state.json"
            cp data/changes.json "$store/$STATE_DIR/changes.json"
            git -C "$store" add "$STATE_DIR/state.json" "$STATE_DIR/changes.json"
            if git -C "$store" diff --cached --quiet; then
              exit 0
            fi
            git -C "$store" commit -m "Update $BRAND catalog state (run $GITHUB_RUN_ID)"
            if git -C "$store" push origin HEAD:refs/heads/monitor-state; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); retrying on the latest monitor-state."
            sleep $((attempt * 5))
          done
          exit 1
