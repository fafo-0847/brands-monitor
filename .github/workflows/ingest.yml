name: Ingest snapshots into the database
on:
  workflow_run:
    workflows: ['Monitor Pakistan fashion brands (incl. Khushposh, Outfitters)']
    types: [completed]
  workflow_dispatch:
    inputs:
      brands:
        description: 'Optional space-separated brand slugs (blank = all enabled)'
        required: false
        default: ''
      force:
        description: 'Accept snapshots sharing under half of the live products (type yes)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Optional: only needed if 'enhanced push security' is turned on in the Expo dashboard.
      EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
      INGEST_BRANDS: ${{ github.event.inputs.brands || vars.INGEST_BRANDS }}
      FORCE: ${{ github.event.inputs.force }}
    steps:
      - name: Check that a database is configured
        id: config
        shell: bash
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::notice::DATABASE_URL secret is not set; nothing to ingest into."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: pip install -r pipeline/requirements.txt
      - name: Fetch snapshot history (commits only; snapshots are downloaded when read)
        if: steps.config.outputs.ready == 'true'
        run: git fetch --no-tags --filter=blob:none origin '+refs/heads/monitor-state:refs/remotes/origin/monitor-state'
      - name: Apply pending migrations
        if: steps.config.outputs.ready == 'true'
        run: python -m pipeline.migrate
      - name: Ingest new snapshots
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "${FORCE:-}" = "yes" ]; then args+=(--force); fi
          python -m pipeline.ingest "${args[@]}"
      - name: Report table sizes
        if: steps.config.outputs.ready == 'true' && always()
        run: python -m pipeline.ingest --stats
