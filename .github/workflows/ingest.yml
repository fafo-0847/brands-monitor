name: Ingest snapshots into the database
# Manual only since 2026-11-22: the app's database moved to the Oracle server, which loads new
# snapshots itself (deploy/oracle/). This workflow still loads into the Supabase cloud project in
# NEW_DATABASE_URL (or DATABASE_URL) when run by hand.
on:
  workflow_dispatch:
    inputs:
      brands:
        description: 'Optional space-separated brand slugs (blank = all enabled)'
        required: false
        default: ''
      force:
        description: 'Accept snapshots sharing under half of the live products (type yes)'
        required: false
        default: ''
      compact:
        description: 'Also rebuild indexes and tables to shrink the database files (type yes)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # The app's database. NEW_DATABASE_URL (the project the app uses since 2026-11-21) wins; the old
      # project stays in DATABASE_URL as a backup and is written only if NEW_DATABASE_URL is removed.
      DATABASE_URL: ${{ secrets.NEW_DATABASE_URL || secrets.DATABASE_URL }}
      # Optional: only needed if 'enhanced push security' is turned on in the Expo dashboard.
      EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
      INGEST_BRANDS: ${{ github.event.inputs.brands || vars.INGEST_BRANDS }}
      FORCE: ${{ github.event.inputs.force }}
      COMPACT: ${{ github.event.inputs.compact }}
    steps:
      - name: Check that a database is configured
        id: config
        shell: bash
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::notice::Neither NEW_DATABASE_URL nor DATABASE_URL is set; nothing to ingest into."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: pip install -r pipeline/requirements.txt
      - name: Fetch snapshot history (commits only; snapshots are downloaded when read)
        if: steps.config.outputs.ready == 'true'
        run: git fetch --no-tags --filter=blob:none origin '+refs/heads/monitor-state:refs/remotes/origin/monitor-state'
      - name: Apply pending migrations
        if: steps.config.outputs.ready == 'true'
        run: python -m pipeline.migrate
      - name: Trim rows and delete old data
        if: steps.config.outputs.ready == 'true'
        run: python -m pipeline.maintain
      - name: Ingest new snapshots
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "${FORCE:-}" = "yes" ]; then args+=(--force); fi
          python -m pipeline.ingest "${args[@]}"
      - name: Rebuild indexes and tables that fit (on request)
        if: steps.config.outputs.ready == 'true' && env.COMPACT == 'yes'
        run: python -m pipeline.maintain --compact
      - name: Report table sizes
        if: steps.config.outputs.ready == 'true' && always()
        run: python -m pipeline.ingest --stats
